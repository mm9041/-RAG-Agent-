collection_name: agent
# 相对项目根的路径（代码内用 get_abs_path 锚定，不受启动目录影响）
persist_directory: chroma_db
# 去重清单已并入 chroma_db/kb_meta.json（旧版是项目根的 md5.text）
k: 3
data_path: data
allow_knowledge_file_type: ["txt", "pdf"]

# 切分与检索参数（数值有实测依据，别凭感觉改；改完请跑 eval.retrieval_eval 对比）
#
# chunk_size=200 是实测选出来的，不是随手填的：
#   用 12 题评估集（python -m eval.retrieval_eval）对比：
#     chunk_size=200 朴素 top-3 -> hit@3 = 12/12   ← 当前配置，已在上限
#     chunk_size=200 MMR   top-3 -> hit@3 = 12/12   （MMR 无增益，故不启用）
#     chunk_size=400 朴素 top-3 -> hit@3 = 11/12   （更大反而更差）
#     chunk_size=400 朴素 top-5 -> hit@5 = 12/12   （要靠加大 k 才追平，代价是更多 token）
#   直觉上"200 太碎应该调大"，但实测方向相反 —— 本库是短条目式 FAQ/清单，
#   小块反而定位更准；换成大段连续叙述型文档时结论可能不同，届时以评估集为准。
chunk_size: 200
# chunk_overlap 设 0，是因为**本库上任何小的重叠值都是空转**（实测）：
#   RecursiveCharacterTextSplitter 的重叠实现是"保留末尾若干个完整的 split 单元"，
#   再用 `while total > chunk_overlap` 把放不下的弹出去 —— **不是按字符截**。
#   本库的单元是**整行**（行长中位数 21~40 字、最长 79 字），随便一行都超过 20 字，
#   于是全被弹出 → 真实重叠为 0。
# 实测（全库相邻块的真实重叠）：
#   chunk_overlap=20  -> 平均 0.4 字，**98% 的相邻块对重叠为 0**
#   chunk_overlap=40  -> 平均 10.4 字，62% 为 0
#   chunk_overlap=60  -> 平均 22.3 字，38% 为 0
#   chunk_overlap=100 -> 平均 72.9 字，8% 为 0（块数 330 -> 614）
# 且重叠对检索效果没有帮助（20 / 0 / 100 三档的模型判据都是 18~19/20，属噪声）。
# 更根本的是：上面两步预处理已让**每个条目成为原子单元**，
# 重叠本来要解决的"语义单元被切断"问题已从结构上消除，不再需要重叠。
# 若换成连续叙述型长文档，可以重新考虑给一个 ≥ 中位行长的重叠值。
chunk_overlap: 0
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]
#
# 切分前会做**两步预处理**（见 rag/vector_store.py，均由实测缺口驱动）：
#
# 1) 剥掉 Markdown 标题行（strip_markdown_headings）
#    文档开头常有一行很长的元信息标题，如
#      「# 扫地机器人+扫拖一体机器人 维护保养200条（纯保养维度，分通用基础/…）」
#    它被切进第一个块、能占掉整块近一半的字符，把该块语义严重稀释。
#    实例：「防撞条缝隙的毛发怎么清理？」的答案就在这样一个块里，
#    剥标题前该块距离 0.9414、全库第 32 位、被阈值滤掉；剥后降到 0.8409、排第 1 位。
#
# 2) 把「条目之间的换行」升级成空行（normalize_entry_boundaries）
#    本库是「问句一行 + 回答一行」的条目式结构，按 \n 打包很容易**正好切在
#    问句和它的回答之间**。实测抓到过一个块 164 字、结尾停在
#      「3. **什么是 dToF 导航技术？**」
#    而答案被切进下一块 —— 这种块"带着一个自己回答不了的问题"，命中也没用。
#    改成空行边界后，切分器第一优先级的 \n\n 正好落在条目边界，
#    每个条目（问+答）成为原子单元。
#    刻意不启用 is_separator_regex：正则模式下 "." 会变成"任意字符"，风险大；
#    而"把边界改写成空行"复用了现有分隔符，配置一个字都不用改。
#
# ⚠️ 改动切分逻辑后记得把 SPLITTER_VERSION +1，否则旧库不会重建（已 1→2→3 两次）。

# 相似度距离阈值（**当前关闭**，2026-09-20 用户决定去掉）
#
# 填上数值即启用：距离大于该值的召回结果被视为不相关、直接丢弃；
# 留空（null）表示不过滤。相关逻辑在 rag/vector_store.py: retrieve()，
# 失败时的日志在 rag/rag_service.py: summarize()（会区分"库为空"还是"被阈值滤空"）。
#
# ── 为什么最终选择关闭 ──────────────────────────────────────────
# 1) **阈值必须随 embedding 模型重新标定，漏做会造成静默的质量回退。**
#    实测教训：换 embedding 后沿用旧阈值 0.9，把「吸力应该选多大才够用？」
#    整批滤空（该答案块全库排名第 2、距离 0.9286，只差一点就被挡住）——
#    不报错，只是某些问题突然答不出，**只有评估集能发现**。
# 2) 两个分布已经重叠，阈值无法既"不漏"又"不放噪音"进来：
#    新模型下 覆盖问题 0.5009~1.1821（均值 0.80）、离题问题 1.0288~1.4660（均值 1.26）。
# 3) 实测对比（A 集 20 题陈述性问法 / B 集 20 题口语化问法 + 6 个应拒答问题）：
#       A 集：设 1.00 与不设**完全相同**（关键词 19/20、模型 20/20）
#       B 集：不设略好（模型判据 19/20 -> 20/20，且候选池被清空的题数 1 -> 0）
#       拒答：**四种配置下都是 6/6** —— 关掉阈值不会让离题问题被答歪
# 4) 关闭后"没资料"的判定完全走模型侧的 `[无覆盖]` 标记
#    （prompts/rag_summarize.txt 第 6 条 + agent/runtime.py: NO_COVERAGE_MARKER）。
#
# ── 关闭的代价（要清楚）────────────────────────────────────────
# - 失去了**不依赖模型守约**的结构性兜底：若将来 chat 模型不遵守 `[无覆盖]` 约定，
#   离题问题可能拿到无关资料去作答。所以 `eval/retrieval_eval.py --refusals`
#   这条检查要常态化跑（它走完整工具链路验证拒答能力）。
# - 离题问题不再被短路，会多花一次模型调用（换来的是不会误滤切题内容）。
#
# 若将来想恢复：填一个数值即可，并按上面第 1 条**重新标定**（换过 embedding 就要重标）。
max_distance:


# ---------------------------------------------------------------------------
# 检索重排（rerank）：**已启用**（2026-09-20）
#
# ⚠️ 这一节在 2026-09-19 曾写成"rerank 没有发挥空间"，那个结论是**错的**，
#    原因是当时用的指标是「文件级 hit@3」——只判断"正确的文件在不在 top-k 里"，
#    而一个文件里有几百条条目，命中文件 ≠ 命中答案所在的块。
#
# 实测（12 题，块级判据＝召回的块里是否包含答案必备关键词，逐条核对原文）：
#   块级 hit@3  原配置（无重排，top-3）      7/12 =  58%   ← 约四成问题看不到答案块
#   块级 hit@3  rerank, fetch_k=10         10/12 =  83%
#   块级 hit@3  rerank, fetch_k=20         12/12 = 100%   ← 当前配置
#   块级 hit@3  rerank, fetch_k=30         12/12 = 100%（没有更多收益，只增大请求体）
#
# 两段式流水线（见 rag/vector_store.py: retrieve 与 rag/reranker.py）：
#   粗召回 rerank_fetch_k 条 → 按 max_distance 过滤 → 重排 → 取 k 条
#
# ⚠️ rerank 只能重排"已召回的候选"，捞不回没召回的 —— 所以 fetch_k 必须够大。
#    实测「防撞条缝隙的毛发怎么清理？」在 fetch_k=10 时答案块压根不在候选池里，
#    提到 20 才进来。这条决定了 fetch_k 的下限。
# ⚠️ 分数方向相反：rerank 是**分数越高越相关**，向量库是**距离越小越相似**。
#    实现上重排只输出**下标**、不改距离，所以 max_distance 仍按向量距离判断，
#    两个尺度不会混在一起。
# ⚠️ 重排服务失败会自动降级为"保持向量顺序"，不会让检索整体失败。
rerank_enabled: true
# ⚠️ 2026-09-20 额度轮换记录（免费额度是会被打满的，重排模型额度彼此独立）：
#   gte-rerank-v2        -> 403 额度用尽
#   qwen3.7-text-rerank  -> 曾可用，但当天晚些时候也 403 额度用尽
#   qwen3-rerank         -> 当前使用（额度独立，仍可用）
# 若 qwen3.7-text-rerank 额度恢复，可切回：它的区分度更好 ——
#   qwen3-rerank        正确 0.8869 / 次优 0.3560   → 间距 0.53
#   qwen3.7-text-rerank 正确 0.9364 / 次优 0.1797   → 间距 0.76（更陡，排序更果断）
# 换重排模型不需要重建向量库（它只影响排序、不影响向量），改完即时生效。
# 重排失败会自动降级为向量顺序，不会让检索整体失败（实测额度用尽时正是如此）。
rerank_model: "qwen3-rerank"
rerank_fetch_k: 20

# 重排请求的总超时（秒）。
# 为什么单独要一个：model.yml 的 request_timeout 只作用在 openai 兼容客户端上
# （chat + embedding），重排走 dashscope 自己的 SDK，实测默认 **300 秒**。
# 而"重排失败自动降级为向量顺序"这个兜底只对**报错**生效、对**挂住**无效 ——
# 服务卡住时用户就是干等 5 分钟。给 30s：正常重排是亚秒级，30s 已留足排队余量。
rerank_timeout: 30

# 重排调用的重试（分类逻辑同 utils/retry.py：限流要重试，额度用尽立即失败）
# 重排失败本身会降级为向量顺序，所以这里重试次数给少一点，避免拖慢单次问答。
rerank_retries: 2
retry_backoff: 2
