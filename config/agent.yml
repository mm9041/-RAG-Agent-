external_data_path: data/external/records.csv

# 演示用参考月份。
# mock 外部系统只覆盖 2025-01 ~ 2025-12，若返回真实当前月份会一条记录都查不到，
# 所以这里固定一个落在数据范围内的月份，保证报告流程可跑通。
# 接入真实外部系统时，删掉这一行（或留空），get_current_month 就会返回真实月份。
demo_reference_month: "2025-12"

# 每轮预算；时间在调用边界检查，不能强行取消正在执行的工具。
max_model_calls: 12
turn_timeout: 180
# 消息历史上限（字符数，不是 token）。只约束送进模型的历史，不含 system prompt
# 和工具 schema；grounding 那次调用不受它限制（它只有 3 块原文 + 记录）。
#
# 这个值是"软上限"，不是模型窗口。2026-10-31 实测 deepseek-v4.1-flash-1017：
# 32k / 96k / 192k 字符的"大海捞针"全部命中，说明窗口远大于此，既没截断也没报错。
# 原值 24000 偏保守——一次检索 3 块原文约 1200~1800 字符，4 次检索才 5k~7k，
# 实际几乎碰不到上限，聊得久了反而会先丢早期回合。
#
# 改成 100000 约合 7 万 token。注意三个连带影响：
#   1. 长会话不再丢早期上下文，但每轮要重发全部历史，token 费用线性上升；
#   2. 用户问题本身受 chat 接口的 max_length=4000 约束，不会一次粘贴超长文本；
#   3. 真正超限（裁剪后仍 > 此值）会直接拒答"本轮内容过长"，不截断单条消息。
context_max_chars: 100000

# 普通问答直接返回原文；报告仍走摘要。上线前需对照评估拒答与质量。
rag_raw_documents: true

# 工具选择和普通闲聊默认关闭思考，尽早进入检索或输出正文。
# 使用不支持 enable_thinking 的模型，或需要对照思考模式时，可设为 false。
decision_disable_thinking: true

# 资料已就位（本轮有工具结果）后，生成答案的那次模型调用是否关闭思考。
# 2026-10-30 实测：天气那轮第二次调用 14.5s、719 reasoning token，正文却只有 1~2 秒，
# 界面上表现为「转圈很久 → 文字整块蹦出」。关掉后这段只花 1~2 秒。
# 只影响「已经有资料、只需组织语言」的那次调用；首次决策由上面的开关控制。
# 若发现答案组织质量下降，设为 false 即可回退。
answer_disable_thinking: true

# 天气查询（Tavily 实时搜索）
# timeout 是单次搜索的等待上限。一轮问答总预算是 180s，这里不能给太大；
# 15s 已覆盖正常网络，超时会返回「查询失败」让模型如实告知，而不是让用户干等。
weather_timeout: 15
weather_max_results: 5
